# ==============================================================================
# Telegraf Configuration for trading-monitor-collector
# ==============================================================================
# This configuration is optimized for tailing and collecting the InfluxDB Line
# Protocol (.lp) metrics files generated by the Modern C++ TCP aggregator.
#
# Integration Pattern:
#   1. The C++ collector writes time-bucketed sharded metrics to .lp files in
#      high-throughput micro-batches (e.g. every 1000ms).
#   2. Telegraf scans the output folder, reads any newly created .lp files,
#      parses them into InfluxDB metrics, and pushes them to InfluxDB.
#   3. By setting 'delete_files = true', Telegraf automatically removes files
#      after successfully parsing them, acting as a clean queue/spool system!
# ==============================================================================

[global_tags]
  # Optional global tags to append to all metrics collected
  collector_node = "node-1"
  environment = "production"

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 10000
  metric_buffer_limit = 50000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "ns" # Crucial: Aggregation uses nanosecond-precision epoch timestamps
  hostname = ""
  omit_hostname = false

# ==============================================================================
# OUTPUT PLUGINS: INFLUXDB
# ==============================================================================

# Option A: InfluxDB v2 (Modern / Cloud) - Recommended
[[outputs.influxdb_v2]]
  ## The URLs of the InfluxDB cluster instances.
  urls = ["http://localhost:8086"]

  ## Token for authentication.
  token = "YOUR_INFLUXDB_V2_TOKEN"

  ## Destination organization and bucket.
  organization = "my_trading_company"
  bucket = "trading_telemetry"

  ## Optional TLS Config
  # tls_ca = "/etc/telegraf/ca.pem"
  # tls_cert = "/etc/telegraf/cert.pem"
  # tls_key = "/etc/telegraf/key.pem"
  # insecure_skip_verify = false

# Option B: InfluxDB v1.x (Legacy / Direct InfluxQL) - Uncomment if using InfluxDB v1
# [[outputs.influxdb]]
#   urls = ["http://localhost:8086"]
#   database = "trading_telemetry"
#   username = "telegraf"
#   password = "YOUR_PASSWORD"
#   retention_policy = "autogen"

# ==============================================================================
# INPUT PLUGINS: FILE CONSUMER
# ==============================================================================

[[inputs.file]]
  ## Files to parse. Supports glob patterns.
  ## Change this to target your production or local staging directories.
  files = [
    "/home/kimi/project/learning/tcpclient/output_smoke/marketdata_*.lp",
    "/home/kimi/project/learning/tcpclient/output/marketdata_*.lp"
  ]

  ## Data format to consume. 
  ## Since the C++ program already outputs standard InfluxDB Line Protocol,
  ## we use the "influx" parser which is incredibly fast and memory-efficient.
  data_format = "influx"

  ## Character encoding (usually utf-8 for JSON/Line Protocol).
  character_encoding = "utf-8"

  ## How to handle the matched files after they have been parsed.
  ## Setting this to 'delete' automatically purges processed files.
  ## This guarantees files are only processed once and prevents the output
  ## directory from filling up the disk.
  file_methods = ["delete"]

  ## How often to look for new files. Since the collector flushes every 1000ms,
  ## a 1s interval here keeps latency extremely low.
  interval = "1s"

# ==============================================================================
# DEBUGOUT: FOR LOCAL VERIFICATION
# ==============================================================================
# Uncomment this plugin to output metrics to stdout. This is extremely helpful
# when testing the configuration locally without running InfluxDB!
# [[outputs.file]]
#   files = ["stdout"]
